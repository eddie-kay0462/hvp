name: Deploy backend

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # RAILWAY_TOKEN is a Railway *project token*, which is scoped to one
    # project + environment — that's what picks staging vs production here.
    environment: ${{ github.ref_name == 'main' && 'railway-production' || 'railway-staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}"

      - name: Verify health check
        run: |
          # `railway up --ci` returns once the build is done; the rollout and
          # Railway's own healthcheck still have to finish, so poll rather than
          # curl once.
          for i in $(seq 1 30); do
            if curl -sf --max-time 10 "https://${{ vars.API_DOMAIN }}/health"; then
              echo "Healthy after ${i} attempt(s)."
              exit 0
            fi
            echo "Attempt ${i}: not healthy yet, retrying in 5s..."
            sleep 5
          done
          echo "Health check never passed for https://${{ vars.API_DOMAIN }}/health"
          exit 1
